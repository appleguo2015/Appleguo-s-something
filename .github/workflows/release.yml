name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: appleguo-voice-linux
            install: sudo add-apt-repository -y universe && sudo apt-get update && sudo apt-get install -y build-essential pkg-config libraylib-dev
          - os: windows-latest
            artifact: appleguo-voice-windows
            install: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ${{ matrix.install }}
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-raylib mingw-w64-x86_64-pkgconf make
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        id: build_windows
        continue-on-error: true
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          make OS=Windows_NT CXX=g++ WINDRES=windres PKG_CONFIG=pkgconf all banana 2>&1 | tee windows-build.log
      - name: Upload Windows build log
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: appleguo-windows-build-log
          path: windows-build.log
      - name: Publish Windows diagnostic summary
        if: runner.os == 'Windows' && steps.build_windows.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('windows-build.log', 'utf8').slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Windows build diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: { title: 'Windows build failure', summary: `\`\`\`text\n${log}\n\`\`\`` }
            });
      - name: Report Windows build failure
        if: runner.os == 'Windows' && steps.build_windows.outcome == 'failure'
        shell: msys2 {0}
        run: exit 1
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: make STATIC=1
      - name: Prepare Linux portable application
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh
      - name: Prepare Windows portable application
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp -R out/assets package/assets
          cp out/virtual_singer.exe package/
          ldd out/virtual_singer.exe | awk '/=> \/mingw64\/bin/ { print $3 }' | while read -r library; do cp "$library" package/; done
      - name: Prepare Banana Dancing Windows application
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p banana-package
          mkdir -p banana-package/assets
          cp -R out/assets/banana banana-package/assets/banana
          cp out/banana_dance.exe banana-package/
          ldd out/banana_dance.exe | awk '/=> \/mingw64\/bin/ { print $3 }' | while read -r library; do cp "$library" banana-package/; done
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path package\* -DestinationPath ${{ matrix.artifact }}.zip
      - name: Archive Banana Dancing Windows application
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path banana-package\* -DestinationPath banana-dancing-windows.zip
      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && format('{0}.zip', matrix.artifact) || format('{0}.tar.gz', matrix.artifact) }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: banana-dancing-windows
          path: banana-dancing-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install raylib pkg-config imagemagick
      - name: Build distributable macOS apps
        run: make app banana-app
      - uses: actions/upload-artifact@v4
        with:
          name: appleguo-voice-macos
          path: dist/appleguo-voice-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: banana-dancing-macos
          path: dist/banana-dancing-macos.zip

  publish:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [portable, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appleguo-voice-*
          path: release/appleguo-voice
      - uses: actions/download-artifact@v4
        with:
          pattern: banana-dancing-*
          path: release/banana-dancing
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/**/*
